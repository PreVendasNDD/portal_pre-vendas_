<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Parâmetros NDD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-image: url('assets/fundoazul.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fff;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h1 { color: #1a2f4f; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #777; font-size: 14px; margin-bottom: 25px; }

        /* ---------- MODAL PARA TOKEN ---------- */
        #tokenModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #tokenModal .modal-box {
            background: #fff;
            padding: 30px 40px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        #tokenModal .modal-box h3 { color: #1a2f4f; margin-bottom: 10px; }
        #tokenModal .modal-box p { color: #777; font-size: 14px; margin-bottom: 15px; }
        #tokenModal .modal-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
        #tokenModal .modal-box .btn-group-modal { display: flex; gap: 10px; justify-content: flex-end; }
        #tokenModal .modal-box .btn { padding: 8px 25px; border: none; border-radius: 25px; font-weight: 700; font-size: 14px; cursor: pointer; }
        #tokenModal .modal-box .btn-primary { background: #ff7079; color: #fff; }
        #tokenModal .modal-box .btn-primary:hover { background: #e05a61; }
        #tokenModal .modal-box .btn-secondary { background: #6c757d; color: #fff; }
        #tokenModal .modal-box .btn-secondary:hover { background: #495057; }

        /* ---------- PRODUTOS ---------- */
        .product-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .product-selector button {
            padding: 10px 25px;
            border: 2px solid #1a2f4f;
            background: transparent;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            color: #1a2f4f;
        }
        .product-selector button.active { background: #1a2f4f; color: #fff; }
        .product-selector button:hover { background: #1a2f4f; color: #fff; }

        /* ---------- FORMULÁRIO ---------- */
        .param-group {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9e9e9;
        }
        .param-group:last-child { border-bottom: none; }
        .param-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1a2f4f;
            margin-bottom: 2px;
        }
        .param-group .description {
            font-size: 12px;
            color: #777;
            margin-bottom: 6px;
        }
        .param-group input, .param-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
        }
        .param-group input:focus, .param-group textarea:focus {
            border-color: #ff7079;
            outline: none;
            background: #fff;
        }
        .param-group textarea {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            min-height: 60px;
            resize: vertical;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a2f4f;
            margin: 25px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #ff7079;
        }
        .section-title:first-of-type { margin-top: 0; }

        /* ---------- ESTILOS PARA TABELAS ---------- */
        .param-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .param-table th {
            text-align: left;
            border-bottom: 2px solid #ff7079;
            padding: 8px;
            font-weight: 700;
            color: #1a2f4f;
        }
        .param-table td {
            padding: 8px;
            border-bottom: 1px solid #e9e9e9;
            vertical-align: middle;
        }
        .param-table .input-valor {
            width: 80px;
            text-align: center;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .param-table .unidade {
            text-align: center;
            color: #555;
        }

        /* ---------- BOTÕES ---------- */
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
            justify-content: center;
        }
        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background: #ff7079; color: #fff; }
        .btn-primary:hover { background: #e05a61; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #1e7e34; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-secondary:hover { background: #495057; }

        /* ---------- STATUS ---------- */
        .status {
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.loading { background: #cce5ff; color: #004085; display: block; }
    </style>
</head>
<body>

<!-- MODAL PARA TOKEN -->
<div id="tokenModal">
    <div class="modal-box">
        <h3>🔑 Token necessário</h3>
        <p>O token atual é inválido ou expirou. Insira um novo token com permissão <strong>repo</strong>.</p>
        <input type="password" id="modalTokenInput" placeholder="ghp_...">
        <div class="btn-group-modal">
            <button class="btn btn-secondary" onclick="fecharModalToken()">Cancelar</button>
            <button class="btn btn-primary" onclick="salvarTokenModal()">Salvar</button>
        </div>
    </div>
</div>

<div class="container">
    <h1>⚙️ Admin · Parâmetros de Cálculo</h1>
    <p class="subtitle">Edite os valores dos arquivos JSON dos produtos e envie para o GitHub.</p>

    <!-- Seletor de produto -->
    <div class="product-selector">
        <button class="active" data-prod="CARGO" onclick="selecionarProduto('CARGO')">CARGO</button>
        <button data-prod="MOVE" onclick="selecionarProduto('MOVE')">MOVE</button>
        <button data-prod="ELOG" onclick="selecionarProduto('ELOG')">ELOG</button>
    </div>

    <div id="status" class="status"></div>

    <div id="formContainer">
        <p style="color:#999; text-align:center; padding:20px;">Selecione um produto e clique em "Carregar".</p>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="salvarArquivo()">💾 Salvar no GitHub</button>
        <button class="btn btn-success" onclick="fazerDeploy()">🚀 Fazer Deploy</button>
        <button class="btn btn-secondary" onclick="carregarProduto()">📥 Recarregar</button>
    </div>
</div>

<script>
    // ---- CONFIGURAÇÕES ----
    const REPO_OWNER = 'PreVendasNDD';
    const REPO_NAME = 'portal_pre-vendas_';
    const BRANCH = 'main';

    const produtos = {
        CARGO: { file: 'BASE_CARGO.json', path: 'cargo/BASE_CARGO.json' },
        MOVE:  { file: 'BASE_MOVE.json',  path: 'move/BASE_MOVE.json' },
        ELOG:  { file: 'BASE_ELOG.json',  path: 'elog/BASE_ELOG.json' }
    };

    // ---- CHAVES OCULTAS (não aparecem na interface, mas são mantidas no JSON) ----
    const hiddenKeys = ['subetapas', 'fatorAmbientes', 'fatorUsuarios'];

    // ---- MAPEAMENTO DE NOMES AMIGÁVEIS ----
    const labels = {
        // ---- CARGO ----
        horasCIOT: { label: 'Emissão CIOT', desc: 'Valor Fixo se adere ao módulo e Cadastro adicional de CNPJ for Ponto Emissor, se não, é correspondente a quantidade informada no questionário pelo usuário.' },
        horasFrete: { label: 'Pagamento de Frete', desc: 'Valor Fixo se adere ao módulo e Cadastro adicional de CNPJ for Ponto Emissor, se não, é correspondente a quantidade informada no questionário pelo usuário.' },
        horasVale: { label: 'Vale Pedágio Obrigatório', desc: 'Valor Fixo se adere ao módulo e Cadastro adicional de CNPJ for Ponto Emissor, se não, é correspondente a quantidade informada no questionário pelo usuário.' },
        horasContaDigital: { label: 'Conta Digital (validação NDD)', desc: 'Valor Fixo se adere a movimentação financeira.' },
        horasContaDigitalExterna: { label: 'Conta Digital (externo - abertura conta)', desc: 'Valor Fixo se adere a movimentação financeira.' },
        horasCadastro: { label: 'Cadastro e Parametrização', desc: '1h por CNPJ, fixo se demais cadastros for Ponto Emissor, se não, é correspondente a qtdde.' },
        horasUsuario: { label: 'Criação e Configuração de Usuários', desc: 'Valor correspondente a qtdde de usuários.' },
        horasTreinamento: { label: 'Acompanhamento e Treinamentos', desc: 'Valor Fixo.' },
        jornadaDiaria: { label: 'Jornada Diária (horas)', desc: 'Quantas horas tem um dia útil de trabalho.' },
        jornadaSemanal: { label: 'Jornada Semanal (horas)', desc: 'Quantas horas tem uma semana de trabalho.' },

        // ---- MOVE ----
        baseApp: { label: 'App Conector', desc: 'Valor Fixo.' },
        baseAmbientes: { label: 'Configuração de Ambientes', desc: '4h + 1h por CNPJ adicional.' },
        baseCadastro: { label: 'Cadastro e Parametrização', desc: '2h + 1h por CNPJ adicional.' },
        baseUsuarios: { label: 'Criação e Configuração de Usuários', desc: '2h + 1h por usuário adicional.' },
        baseGoLive: { label: 'Go Live', desc: 'Valor Fixo.' },
        baseSustentacao: { label: 'Sustentação Pós Go Live', desc: 'Valor Fixo.' },
        baseTreinamento: { label: 'Treinamentos', desc: 'Valor Fixo.' },

        // ---- ELOG ----
        horasEssencial: { label: 'Essencial', desc: 'Valor Fixo se adere ao módulo.' },
        horasTorre: { label: 'Torre de Controle', desc: 'Valor Fixo se adere ao módulo.' },
        horasVale: { label: 'Vale Pedágio / VPO', desc: 'Valor Fixo se adere ao módulo.' },
        horasFrete: { label: 'Pagamento de Frete', desc: 'Valor Fixo se adere ao módulo.' },
        horasAuditoria: { label: 'Auditoria de Fretes', desc: 'Valor Fixo se adere ao módulo.' },
        baseAmbientes: { label: 'Configuração de Ambientes', desc: '32h + 3h por CNPJ adicional' },
        baseCadastro: { label: 'Cadastro e Parametrização', desc: '16h + 3h por CNPJ adicional' },
        baseUsuarios: { label: 'Criação e Configuração de Usuários', desc: '2h + 1h por usuário adicional' },
        horasGoLive: { label: 'Go Live', desc: 'Valor Fixo' },
        horasSustentacao: { label: 'Sustentação Pós Go Live', desc: 'Valor Fixo' },
        horasTreinamento: { label: 'Treinamentos', desc: 'Valor Fixo' },
        horasPedidos: { label: 'Pedidos', desc: 'Valor Fixo' },
        horasEventos: { label: 'Eventos Logísticos', desc: 'Valor Fixo' },
        horasPagamento: { label: 'Pagamento', desc: 'Valor Fixo' },
        incrementoAmbientes: { label: 'CNPJ adicional', desc: 'Valor base para cálculo' },
        incrementoUsuarios: { label: 'Usuário', desc: 'Valor base para cálculo' }
    };

    // ---- AGRUPAMENTOS (sem as chaves ocultas) ----
    const sections = {
        CARGO: {
            grupos: [
                { title: '📦 Módulos', keys: ['horasCIOT', 'horasFrete', 'horasVale', 'horasContaDigital', 'horasContaDigitalExterna'] },
                { title: '🏗️ Etapas', keys: ['horasCadastro', 'horasUsuario', 'horasTreinamento'] },
                { title: '📊 Itens de valor unitário', keys: ['horasCadastro', 'horasUsuario'] },
                { title: '📅 Jornada', keys: ['jornadaDiaria', 'jornadaSemanal'] }
            ]
        },
        MOVE: {
            grupos: [
                { title: '🔗 Integração', keys: ['baseApp'] },
                { title: '🏗️ Etapas', keys: ['baseAmbientes', 'baseCadastro', 'baseUsuarios', 'baseGoLive', 'baseSustentacao', 'baseTreinamento'] },
                { title: '📊 Itens de valor unitário', keys: ['baseAmbientes', 'baseCadastro', 'baseUsuarios'] }
            ]
        },
        ELOG: {
            grupos: [
                { title: '📦 Módulos', keys: ['horasEssencial', 'horasTorre', 'horasVale', 'horasFrete', 'horasAuditoria'] },
                { title: '🏗️ Etapas', keys: ['baseAmbientes', 'baseCadastro', 'baseUsuarios', 'horasGoLive', 'horasSustentacao', 'horasTreinamento'] },
                { title: '🔗 Processos', keys: ['horasPedidos', 'horasEventos', 'horasPagamento'] },
                { title: '📊 Itens de valor unitário', keys: ['incrementoAmbientes', 'incrementoUsuarios'] },
                { title: '📅 Jornada', keys: ['jornadaDiaria', 'jornadaSemanal'] }
            ]
        }
    };

    let currentProduct = 'CARGO';
    let currentData = null;
    let currentSha = null;

    const statusDiv = document.getElementById('status');
    const formContainer = document.getElementById('formContainer');

    // ---- TOKEN (oculto no localStorage) ----
    let storedToken = localStorage.getItem('githubToken') || '';

    function mostrarModalToken() {
        document.getElementById('tokenModal').style.display = 'flex';
        document.getElementById('modalTokenInput').value = '';
        document.getElementById('modalTokenInput').focus();
    }

    function fecharModalToken() {
        document.getElementById('tokenModal').style.display = 'none';
    }

    function salvarTokenModal() {
        const novoToken = document.getElementById('modalTokenInput').value.trim();
        if (novoToken) {
            storedToken = novoToken;
            localStorage.setItem('githubToken', novoToken);
            fecharModalToken();
            setStatus('✅ Token atualizado. Recarregando...', 'loading');
            setTimeout(() => carregarProduto(), 500);
        } else {
            alert('Por favor, insira um token válido.');
        }
    }

    document.getElementById('tokenModal').addEventListener('click', function(e) {
        if (e.target === this) fecharModalToken();
    });

    function getToken() { return storedToken; }

    function selecionarProduto(prod) {
        currentProduct = prod;
        document.querySelectorAll('.product-selector button').forEach(b => b.classList.remove('active'));
        document.querySelector(`.product-selector button[data-prod="${prod}"]`).classList.add('active');
        formContainer.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">Clique em "Carregar" para ver os parâmetros.</p>';
        currentData = null;
        currentSha = null;
        setStatus('', '');
    }

    function setStatus(msg, type = '') {
        statusDiv.textContent = msg;
        statusDiv.className = 'status';
        if (type) statusDiv.classList.add(type);
        if (!msg) statusDiv.style.display = 'none';
        else statusDiv.style.display = 'block';
    }

    // ---- Carregar JSON ----
    async function carregarProduto() {
        const token = getToken();
        if (!token) {
            mostrarModalToken();
            return;
        }

        const filePath = produtos[currentProduct].path;
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}?ref=${BRANCH}`;

        setStatus('🔄 Carregando arquivo...', 'loading');

        try {
            const response = await fetch(url, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    mostrarModalToken();
                    setStatus('', '');
                    return;
                }
                if (response.status === 404) {
                    throw new Error(`Arquivo ${filePath} não encontrado.`);
                }
                const err = await response.json();
                throw new Error(err.message || `Erro ${response.status}`);
            }

            const data = await response.json();
            const content = atob(data.content);
            currentSha = data.sha;
            currentData = JSON.parse(content);
            renderForm(currentData);
            setStatus(`✅ ${produtos[currentProduct].file} carregado!`, 'success');
        } catch (error) {
            setStatus(`❌ ${error.message}`, 'error');
            console.error(error);
        }
    }

    // ---- Renderizar formulário (ocultando chaves especificadas) ----
    function renderForm(data) {
        if (!data || typeof data !== 'object') {
            formContainer.innerHTML = '<p style="color:red;">Dados inválidos.</p>';
            return;
        }

        let html = '';
        const productSections = sections[currentProduct];

        if (!productSections) {
            formContainer.innerHTML = '<p style="color:red;">Seção não encontrada para este produto.</p>';
            return;
        }

        // Renderiza apenas as chaves visíveis (excluindo as ocultas)
        for (const section of productSections.grupos) {
            // Filtra chaves que não estão na lista de ocultas
            const visibleKeys = section.keys.filter(key => !hiddenKeys.includes(key));
            if (visibleKeys.length === 0) continue; // Se não houver chaves visíveis, pula a seção

            html += `<div class="section-title">${section.title}</div>`;
            html += `<table class="param-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th style="text-align:center;">Valor</th>
                        <th style="text-align:center;">Unidade</th>
                        <th>Observações</th>
                    </tr>
                </thead>
                <tbody>`;
            for (const key of visibleKeys) {
                if (data[key] === undefined) continue;
                const value = data[key];
                const labelInfo = labels[key] || { label: key, desc: '' };
                html += `<tr>
                    <td><strong>${labelInfo.label}</strong></td>
                    <td style="text-align:center;">
                        <input type="text" id="param_${key}" value="${value !== undefined && value !== null ? value : ''}" class="input-valor">
                    </td>
                    <td class="unidade">horas</td>
                    <td>${labelInfo.desc}</td>
                </tr>`;
            }
            html += `</tbody></table>`;
        }

        // ---- Chaves extras (excluindo também as ocultas) ----
        const allKeys = new Set(productSections.grupos.flatMap(s => s.keys));
        const extraKeys = Object.keys(data).filter(k => !allKeys.has(k) && !hiddenKeys.includes(k));
        if (extraKeys.length > 0) {
            html += `<div class="section-title">🔧 Outros Parâmetros</div>`;
            html += `<table class="param-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th style="text-align:center;">Valor</th>
                        <th style="text-align:center;">Unidade</th>
                        <th>Observações</th>
                    </tr>
                </thead>
                <tbody>`;
            for (const key of extraKeys) {
                const value = data[key];
                const labelInfo = labels[key] || { label: key, desc: '' };
                html += `<tr>
                    <td><strong>${labelInfo.label}</strong></td>
                    <td style="text-align:center;">
                        <input type="text" id="param_${key}" value="${value !== undefined && value !== null ? value : ''}" class="input-valor">
                    </td>
                    <td class="unidade">horas</td>
                    <td>${labelInfo.desc}</td>
                </tr>`;
            }
            html += `</tbody></table>`;
        }

        formContainer.innerHTML = html;
    }

    // ---- Salvar ----
    async function salvarArquivo() {
        if (!currentData) { setStatus('⚠️ Nenhum dado carregado.', 'error'); return; }
        const token = getToken();
        if (!token) { mostrarModalToken(); return; }

        const updatedData = { ...currentData };
        const inputs = formContainer.querySelectorAll('input, textarea');
        for (const el of inputs) {
            const key = el.id.replace('param_', '');
            if (el.tagName === 'TEXTAREA') {
                try {
                    updatedData[key] = JSON.parse(el.value);
                } catch (e) {
                    setStatus(`❌ Erro no campo "${key}": JSON inválido.`, 'error');
                    return;
                }
            } else {
                let val = el.value;
                updatedData[key] = (!isNaN(val) && val !== '') ? Number(val) : val;
            }
        }

        const jsonString = JSON.stringify(updatedData, null, 2);
        const filePath = produtos[currentProduct].path;
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`;
        const payload = {
            message: `Atualizado ${produtos[currentProduct].file} via admin`,
            content: btoa(jsonString),
            sha: currentSha,
            branch: BRANCH
        };

        setStatus('🔄 Enviando...', 'loading');

        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    mostrarModalToken();
                    setStatus('', '');
                    return;
                }
                const err = await response.json();
                throw new Error(err.message || `Erro ${response.status}`);
            }

            const result = await response.json();
            currentSha = result.content.sha;
            currentData = updatedData;
            setStatus(`✅ ${produtos[currentProduct].file} atualizado!`, 'success');
        } catch (error) {
            setStatus(`❌ ${error.message}`, 'error');
            console.error(error);
        }
    }

    async function fazerDeploy() {
        setStatus('🚀 Deploy...', 'loading');
        await salvarArquivo();
    }

    // ---- Inicialização ----
    window.onload = function() {
        if (storedToken) {
            setTimeout(() => carregarProduto(), 500);
        } else {
            mostrarModalToken();
        }
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Parâmetros NDD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-image: url('assets/fundoazul.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fff;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h1 { color: #1a2f4f; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #777; font-size: 14px; margin-bottom: 25px; }

        .token-section {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #e9e9e9;
        }
        .token-section label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px; }
        .token-section input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .token-section .hint { font-size: 12px; color: #777; margin-top: 4px; }

        .product-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .product-selector button {
            padding: 10px 25px;
            border: 2px solid #1a2f4f;
            background: transparent;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            color: #1a2f4f;
        }
        .product-selector button.active { background: #1a2f4f; color: #fff; }
        .product-selector button:hover { background: #1a2f4f; color: #fff; }

        .param-group {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9e9e9;
        }
        .param-group:last-child { border-bottom: none; }
        .param-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1a2f4f;
            margin-bottom: 2px;
        }
        .param-group .description {
            font-size: 12px;
            color: #777;
            margin-bottom: 6px;
        }
        .param-group input, .param-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
        }
        .param-group input:focus, .param-group textarea:focus {
            border-color: #ff7079;
            outline: none;
            background: #fff;
        }
        .param-group textarea {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            min-height: 60px;
            resize: vertical;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a2f4f;
            margin: 25px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #ff7079;
        }
        .section-title:first-of-type { margin-top: 0; }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background: #ff7079; color: #fff; }
        .btn-primary:hover { background: #e05a61; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #1e7e34; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-secondary:hover { background: #495057; }

        .status {
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.loading { background: #cce5ff; color: #004085; display: block; }

        .json-preview {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow: auto;
            border: 1px solid #ddd;
            margin-top: 15px;
        }
        .info-box {
            background: #f0f4f9;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #ff7079;
        }
        .info-box p { font-size: 14px; color: #1a2f4f; margin: 0; }
        .badge {
            display: inline-block;
            background: #ff7079;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚙️ Admin · Parâmetros de Cálculo</h1>
    <p class="subtitle">Edite os valores dos arquivos JSON e envie para o GitHub.</p>

    <!-- Token -->
    <div class="token-section">
        <label for="tokenInput">🔑 Token do GitHub</label>
        <input type="password" id="tokenInput" placeholder="ghp_...">
        <div class="hint">Token com permissão <strong>repo</strong>. Será salvo no seu navegador.</div>
    </div>

    <!-- Produtos -->
    <div class="product-selector">
        <button class="active" data-prod="CARGO" onclick="selecionarProduto('CARGO')">CARGO</button>
        <button data-prod="MOVE" onclick="selecionarProduto('MOVE')">MOVE</button>
        <button data-prod="ELOG" onclick="selecionarProduto('ELOG')">ELOG</button>
    </div>

    <div id="status" class="status"></div>

    <!-- Formulário -->
    <div id="formContainer">
        <p style="color:#999; text-align:center; padding:20px;">Selecione um produto, insira o token e clique em "Carregar".</p>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="salvarArquivo()">💾 Salvar no GitHub</button>
        <button class="btn btn-success" onclick="fazerDeploy()">🚀 Fazer Deploy</button>
        <button class="btn btn-secondary" onclick="carregarProduto()">📥 Recarregar</button>
    </div>

    <div style="margin-top:20px;">
        <h3 style="font-size:16px; color:#1a2f4f;">📄 Pré-visualização do JSON</h3>
        <div id="jsonPreview" class="json-preview">Nenhum JSON carregado.</div>
    </div>
</div>

<script>
    // ---- CONFIGURAÇÕES ----
    const REPO_OWNER = 'PreVendasNDD';
    const REPO_NAME = 'portal_pre-vendas_';
    const BRANCH = 'main';

    const produtos = {
        CARGO: { file: 'BASE_CARGO.json', path: 'cargo/BASE_CARGO.json' },
        MOVE:  { file: 'BASE_MOVE.json',  path: 'move/BASE_MOVE.json' },
        ELOG:  { file: 'BASE_ELOG.json',  path: 'elog/BASE_ELOG.json' }
    };

    // ---- MAPEAMENTO DE NOMES AMIGÁVEIS (CARGO) ----
    const labels = {
        // CARGO
        horasPorCnpj: { label: 'Horas por CNPJ', desc: 'Tempo para cadastrar cada CNPJ na parametrização operacional.' },
        horasPorUsuario: { label: 'Horas por Usuário', desc: 'Tempo para criar e configurar cada usuário.' },
        horasPorCnpjModulo: { label: 'Horas por CNPJ (Módulos)', desc: 'Tempo para configurar cada módulo (CIOT, Frete, Vale) por CNPJ.' },
        horasContaDigital: { label: 'Horas - Conta Digital', desc: 'Tempo para criar a conta digital (se Frete ou Vale estiverem ativos).' },
        horasTreinamento: { label: 'Horas - Treinamento', desc: 'Tempo fixo para acompanhamento e treinamento.' },
        jornadaDiaria: { label: 'Jornada Diária (horas)', desc: 'Quantas horas tem um dia útil de trabalho.' },
        jornadaSemanal: { label: 'Jornada Semanal (horas)', desc: 'Quantas horas tem uma semana de trabalho.' },

        // MOVE
        baseAmbientes: { label: 'Base - Ambientes', desc: 'Tempo base para configuração de ambientes (HMG + PRD).' },
        baseCadastro: { label: 'Base - Cadastro', desc: 'Tempo base para cadastro e parametrização.' },
        baseUsuarios: { label: 'Base - Usuários', desc: 'Tempo base para criação de usuários (primeiros usuários).' },
        incrementoUsuarios: { label: 'Incremento por Usuário', desc: 'Horas adicionais por usuário extra.' },
        baseApp: { label: 'Base - App Conector', desc: 'Tempo para configuração e instalação do App Conector.' },
        fatorAmbientes: { label: 'Fator - Ambientes', desc: 'Percentual aplicado sobre o tempo de ambientes (ex: 0.99 = 99%).' },
        fatorUsuarios: { label: 'Fator - Usuários', desc: 'Percentual aplicado sobre o tempo de usuários.' },

        // ELOG
        incrementoAmbientes: { label: 'Incremento por CNPJ (Ambientes)', desc: 'Horas adicionais por CNPJ na configuração de ambientes.' },
        incrementoCadastro: { label: 'Incremento por CNPJ (Cadastro)', desc: 'Horas adicionais por CNPJ no cadastro e parametrização.' },
        horasPedidos: { label: 'Horas - Integração Pedidos', desc: 'Tempo para configurar a integração de Pedidos.' },
        horasEventos: { label: 'Horas - Integração Eventos', desc: 'Tempo para configurar a integração de Eventos Logísticos.' },
        horasPagamento: { label: 'Horas - Integração Pagamento', desc: 'Tempo para configurar a integração de Pagamento.' },
        horasEssencial: { label: 'Horas - Módulo Essencial', desc: 'Tempo para configurar o módulo Essencial.' },
        horasTorre: { label: 'Horas - Torre de Controle', desc: 'Tempo para configurar o módulo Torre de Controle.' },
        horasVale: { label: 'Horas - Vale Pedágio Obrigatório', desc: 'Tempo para configurar o módulo VPO.' },
        horasFrete: { label: 'Horas - Pagamento de Frete', desc: 'Tempo para configurar o módulo Pagamento de Frete.' },
        horasAuditoria: { label: 'Horas - Auditoria de Fretes', desc: 'Tempo para configurar o módulo Auditoria de Fretes.' },
        horasGoLive: { label: 'Horas - Go Live', desc: 'Tempo para acompanhamento de entrada em produção.' },
        horasSustentacao: { label: 'Horas - Sustentação', desc: 'Tempo de suporte operacional pós-implantação.' },
        horasTreinamento: { label: 'Horas - Treinamento', desc: 'Tempo fixo para treinamento.' }
    };

    // ---- Agrupamentos ----
    const sections = {
        CARGO: [
            { title: '⏱️ Tempos Base', keys: ['horasPorCnpj', 'horasPorUsuario', 'horasPorCnpjModulo'] },
            { title: '📦 Módulos e Serviços', keys: ['horasContaDigital', 'horasTreinamento'] },
            { title: '📅 Jornada', keys: ['jornadaDiaria', 'jornadaSemanal'] }
        ],
        MOVE: [
            { title: '🏗️ Ambientes e Cadastro', keys: ['baseAmbientes', 'baseCadastro'] },
            { title: '👤 Usuários', keys: ['baseUsuarios', 'incrementoUsuarios'] },
            { title: '📱 App Conector', keys: ['baseApp'] },
            { title: '📊 Fatores de Ajuste', keys: ['fatorAmbientes', 'fatorUsuarios'] }
        ],
        ELOG: [
            { title: '🏗️ Ambientes e Cadastro', keys: ['baseAmbientes', 'incrementoAmbientes', 'baseCadastro', 'incrementoCadastro'] },
            { title: '👤 Usuários', keys: ['baseUsuarios', 'incrementoUsuarios'] },
            { title: '🔗 Integrações', keys: ['horasPedidos', 'horasEventos', 'horasPagamento'] },
            { title: '📦 Módulos', keys: ['horasEssencial', 'horasTorre', 'horasVale', 'horasFrete', 'horasAuditoria'] },
            { title: '🚀 Go Live e Sustentação', keys: ['horasGoLive', 'horasSustentacao', 'horasTreinamento'] },
            { title: '📅 Jornada', keys: ['jornadaDiaria', 'jornadaSemanal'] },
            { title: '📊 Fatores de Ajuste', keys: ['fatorAmbientes', 'fatorUsuarios'] }
        ]
    };

    let currentProduct = 'CARGO';
    let currentData = null;
    let currentSha = null;

    const statusDiv = document.getElementById('status');
    const formContainer = document.getElementById('formContainer');
    const jsonPreview = document.getElementById('jsonPreview');
    const tokenInput = document.getElementById('tokenInput');

    // ---- Carregar token salvo ----
    window.onload = function() {
        const savedToken = localStorage.getItem('githubToken');
        if (savedToken) tokenInput.value = savedToken;
        tokenInput.addEventListener('change', function() {
            localStorage.setItem('githubToken', this.value);
        });
        setTimeout(() => carregarProduto(), 500);
    };

    function getToken() { return tokenInput.value.trim(); }

    function selecionarProduto(prod) {
        currentProduct = prod;
        document.querySelectorAll('.product-selector button').forEach(b => b.classList.remove('active'));
        document.querySelector(`.product-selector button[data-prod="${prod}"]`).classList.add('active');
        formContainer.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">Clique em "Carregar" para ver os parâmetros.</p>';
        jsonPreview.textContent = 'Nenhum JSON carregado.';
        currentData = null;
        currentSha = null;
        setStatus('', '');
    }

    function setStatus(msg, type = '') {
        statusDiv.textContent = msg;
        statusDiv.className = 'status';
        if (type) statusDiv.classList.add(type);
        if (!msg) statusDiv.style.display = 'none';
        else statusDiv.style.display = 'block';
    }

    // ---- Carregar JSON ----
    async function carregarProduto() {
        const token = getToken();
        if (!token) { setStatus('⚠️ Insira um token do GitHub.', 'error'); return; }

        const filePath = produtos[currentProduct].path;
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}?ref=${BRANCH}`;

        setStatus('🔄 Carregando arquivo...', 'loading');

        try {
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });

            if (!response.ok) {
                if (response.status === 404) throw new Error(`Arquivo ${filePath} não encontrado.`);
                if (response.status === 401 || response.status === 403) throw new Error('Token inválido.');
                const err = await response.json();
                throw new Error(err.message || `Erro ${response.status}`);
            }

            const data = await response.json();
            const content = atob(data.content);
            currentSha = data.sha;
            currentData = JSON.parse(content);
            renderForm(currentData);
            jsonPreview.textContent = JSON.stringify(currentData, null, 2);
            setStatus(`✅ ${produtos[currentProduct].file} carregado!`, 'success');
        } catch (error) {
            setStatus(`❌ ${error.message}`, 'error');
            console.error(error);
        }
    }

    // ---- Renderizar formulário com seções e descrições ----
    function renderForm(data) {
        if (!data || typeof data !== 'object') {
            formContainer.innerHTML = '<p style="color:red;">Dados inválidos.</p>';
            return;
        }

        const productSections = sections[currentProduct] || [];
        let html = '';

        for (const section of productSections) {
            html += `<div class="section-title">${section.title}</div>`;
            for (const key of section.keys) {
                if (data[key] === undefined) continue;
                const value = data[key];
                const labelInfo = labels[key] || { label: key, desc: '' };
                const isObject = typeof value === 'object' && value !== null && !Array.isArray(value);
                const isArray = Array.isArray(value);

                html += `<div class="param-group">`;
                html += `<label for="param_${key}">${labelInfo.label}</label>`;
                if (labelInfo.desc) html += `<div class="description">${labelInfo.desc}</div>`;

                if (isObject || isArray) {
                    html += `<textarea id="param_${key}" rows="4">${JSON.stringify(value, null, 2)}</textarea>`;
                } else {
                    html += `<input type="text" id="param_${key}" value="${value !== undefined && value !== null ? value : ''}">`;
                }
                html += `</div>`;
            }
        }

        // Se não houver seções definidas, exibe todos os campos em ordem alfabética
        if (!html) {
            for (const [key, value] of Object.entries(data)) {
                const labelInfo = labels[key] || { label: key, desc: '' };
                html += `<div class="param-group">`;
                html += `<label for="param_${key}">${labelInfo.label}</label>`;
                if (labelInfo.desc) html += `<div class="description">${labelInfo.desc}</div>`;
                if (typeof value === 'object' && value !== null) {
                    html += `<textarea id="param_${key}" rows="4">${JSON.stringify(value, null, 2)}</textarea>`;
                } else {
                    html += `<input type="text" id="param_${key}" value="${value !== undefined && value !== null ? value : ''}">`;
                }
                html += `</div>`;
            }
        }

        formContainer.innerHTML = html;
    }

    // ---- Salvar ----
    async function salvarArquivo() {
        if (!currentData) { setStatus('⚠️ Nenhum dado carregado.', 'error'); return; }
        const token = getToken();
        if (!token) { setStatus('⚠️ Insira um token.', 'error'); return; }

        const updatedData = {};
        const inputs = formContainer.querySelectorAll('input, textarea');
        for (const el of inputs) {
            const key = el.id.replace('param_', '');
            if (el.tagName === 'TEXTAREA') {
                try { updatedData[key] = JSON.parse(el.value); }
                catch (e) { setStatus(`❌ Erro no campo "${key}": JSON inválido.`, 'error'); return; }
            } else {
                let val = el.value;
                updatedData[key] = (!isNaN(val) && val !== '') ? Number(val) : val;
            }
        }

        const jsonString = JSON.stringify(updatedData, null, 2);
        jsonPreview.textContent = jsonString;

        const filePath = produtos[currentProduct].path;
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`;
        const payload = {
            message: `Atualizado ${produtos[currentProduct].file} via admin`,
            content: btoa(jsonString),
            sha: currentSha,
            branch: BRANCH
        };

        setStatus('🔄 Enviando...', 'loading');

        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.message || `Erro ${response.status}`);
            }

            const result = await response.json();
            currentSha = result.content.sha;
            currentData = updatedData;
            setStatus(`✅ ${produtos[currentProduct].file} atualizado!`, 'success');
        } catch (error) {
            setStatus(`❌ ${error.message}`, 'error');
            console.error(error);
        }
    }

    async function fazerDeploy() {
        setStatus('🚀 Deploy...', 'loading');
        await salvarArquivo();
    }
</script>
</body>
</html>
